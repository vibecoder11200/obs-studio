name: Build Windows
run-name: Build Windows 🪟 ${{ github.ref_name }}

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master
    tags:
      - '[0-9]*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows Build 🪟 (${{ matrix.architecture }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64]
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        with:
          target: ${{ matrix.architecture }}
          config: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'RelWithDebInfo' }}

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        with:
          target: ${{ matrix.architecture }}
          config: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'RelWithDebInfo' }}
          package: true

      - name: Antidetect Audit 🕵️
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path "build_${{ matrix.architecture }}" -Filter "obs-studio-*-windows-${{ matrix.architecture }}.zip" -File | Select-Object -First 1
          if ( -not $zip ) {
            throw "No package zip found for audit."
          }

          # Preset coherence: the identity presets in the settings dialog
          # must never match our own blocklist patterns (phase 1, task 4).
          ./tools/vcam-audit/check-preset-coherence.ps1
          if ( $LASTEXITCODE -ne 0 ) {
            throw "Preset coherence check failed with $($LASTEXITCODE)."
          }

          # Canonical static gate (tools/vcam-audit/README.md) - locates the
          # virtualcam DLL by CLSID resource and scans metadata/names/strings.
          ./tools/vcam-audit/Audit-VirtualCam.ps1 static -Package $zip.FullName
          if ( $LASTEXITCODE -ne 0 ) {
            throw "Antidetect static gate failed with $($LASTEXITCODE) violation(s)."
          }

          # The fork ships no debug symbols - no PDB may remain in the package,
          # and the release payload (audit harness, portable marker, identity
          # helper) must be present.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $pdbs = @($archive.Entries | Where-Object { $_.Name -like '*.pdb' })
            if ( $pdbs.Count -gt 0 ) {
              throw "Package contains $($pdbs.Count) PDB file(s), e.g. $($pdbs[0].FullName)"
            }
            foreach ( $required in 'auxdata/vcam-audit/Audit-VirtualCam.ps1', 'portable_mode', 'core/win-dshow/data/vcamctl.exe' ) {
              $entry = $archive.Entries | Where-Object { $_.FullName -ieq $required }
              if ( -not $entry ) {
                throw "Required release payload missing from package: $required"
              }
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Antidetect audit passed: static gate clean, no PDBs, release payload complete."

      - name: VirtualCam Smoke Test 🧪
        if: github.event_name != 'pull_request'
        run: |
          $ErrorActionPreference = 'Stop'

          $Clsid = '76692E1E-F28F-4DD6-9024-C3A999D30EFB'
          $BrandName = 'Logitech HD Pro Webcam C920'
          $zip = Get-ChildItem -Path "build_${{ matrix.architecture }}" -Filter "obs-studio-*-windows-${{ matrix.architecture }}.zip" -File | Select-Object -First 1
          if ( -not $zip ) {
            throw "No package zip found for smoke test."
          }

          # The updater (frontend/updater/updater.cpp) regsvr32's these exact
          # file names from core\win-dshow\data - assert they exist in the zip.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            foreach ( $name in 'lvc920x64.dll', 'lvc920x86.dll' ) {
              $found = $archive.Entries | Where-Object { $_.FullName -ieq "core/win-dshow/data/$name" }
              if ( -not $found ) {
                throw "Updater-expected virtualcam DLL missing from package: $name"
              }
            }
          } finally {
            $archive.Dispose()
          }

          $testDir = Join-Path $env:RUNNER_TEMP 'vcam-smoke'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $testDir)

          $dll64 = Join-Path $testDir 'core/win-dshow/data/lvc920x64.dll'
          $dll32 = Join-Path $testDir 'core/win-dshow/data/lvc920x86.dll'
          if ( -not (Test-Path $dll64) -or -not (Test-Path $dll32) ) {
            throw "Extracted virtualcam DLLs not found under core/win-dshow/data."
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Runtime.InteropServices.ComTypes;

          namespace VCamSmoke
          {
              public static class DShowEnum
              {
                  [ComImport, Guid("62BE5D10-60EB-11d0-BD3B-00A0C911CE86")]
                  public class SystemDeviceEnum { }

                  [ComImport, Guid("29840822-5B84-11D0-BD3B-00A0C911CE86"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
                  public interface ICreateDevEnum
                  {
                      [PreserveSig]
                      int CreateClassEnumerator(ref Guid classType, out IEnumMoniker ppEnumMoniker, int dwFlags);
                  }

                  [ComImport, Guid("55272A00-42CB-11CE-8135-00AA004BB851"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
                  public interface IPropertyBag
                  {
                      [PreserveSig]
                      int Read([MarshalAs(UnmanagedType.LPWStr)] string pszPropName, out object pVar, IntPtr pErrorLog);

                      [PreserveSig]
                      int Write([MarshalAs(UnmanagedType.LPWStr)] string pszPropName, ref object pVar);
                  }

                  [DllImport("ole32.dll")]
                  public static extern int CoInitializeEx(IntPtr pvReserved, uint dwCoInit);

                  [DllImport("ole32.dll", CharSet = CharSet.Unicode)]
                  public static extern int CreateBindCtx(uint reserved, out IBindCtx ppbc);

                  public struct DeviceInfo
                  {
                      public string Moniker;
                      public string FriendlyName;
                      public string DevicePath;
                  }

                  public static DeviceInfo[] Enumerate()
                  {
                      CoInitializeEx(IntPtr.Zero, 0x2);
                      IBindCtx ctx;
                      CreateBindCtx(0, out ctx);

                      var devEnum = (ICreateDevEnum)new SystemDeviceEnum();
                      var category = new Guid("860BB310-5D01-11D0-BD3B-00A0C911CE86");
                      IEnumMoniker enumMoniker;
                      int hr = devEnum.CreateClassEnumerator(ref category, out enumMoniker, 0);
                      if (hr != 0 || enumMoniker == null) return new DeviceInfo[0];

                      var results = new System.Collections.Generic.List<DeviceInfo>();
                      var monikers = new IMoniker[1];
                      IntPtr fetched = Marshal.AllocHGlobal(4);
                      while (enumMoniker.Next(1, monikers, fetched) == 0)
                      {
                          var info = new DeviceInfo();
                          monikers[0].GetDisplayName(ctx, null, out info.Moniker);
                          Guid bagIid = new Guid("55272A00-42CB-11CE-8135-00AA004BB851");
                          object storage;
                          monikers[0].BindToStorage(ctx, null, ref bagIid, out storage);
                          if (storage is IPropertyBag bag)
                          {
                              object value;
                              if (bag.Read("FriendlyName", out value, IntPtr.Zero) == 0 && value != null)
                                  info.FriendlyName = value.ToString();
                              if (bag.Read("DevicePath", out value, IntPtr.Zero) == 0 && value != null)
                                  info.DevicePath = value.ToString();
                          }
                          results.Add(info);
                          Marshal.ReleaseComObject(monikers[0]);
                      }
                      Marshal.FreeHGlobal(fetched);
                      Marshal.ReleaseComObject(enumMoniker);
                      Marshal.ReleaseComObject(devEnum);
                      return results.ToArray();
                  }
              }
          }
          '@

          try {
            # Register both modules, capturing the real exit code and any
            # regsvr32 output. The 64-bit registration is strict (the plan's
            # primary check); 32-bit is informational because x86 DShow
            # filter registration is environment-sensitive on Windows Server
            # runners - the x86 DLL itself is verified via the package asserts.
            foreach ( $leg in @(@{ dll = $dll64; label = '64-bit'; regsvr = "$env:SystemRoot\System32\regsvr32.exe" }, @{ dll = $dll32; label = '32-bit'; regsvr = "$env:SystemRoot\SYSWOW64\regsvr32.exe" }) ) {
              $outFile = Join-Path $testDir "regsvr32-$($leg.label).log"
              $proc = Start-Process -FilePath $leg.regsvr -ArgumentList '/s', '/i', "`"$($leg.dll)`"" -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError "$outFile.err"
              Write-Host "regsvr32 ($($leg.label)) exit code: $($proc.ExitCode)"
              $logText = (Get-Content $outFile -Raw -ErrorAction SilentlyContinue) + (Get-Content "$outFile.err" -Raw -ErrorAction SilentlyContinue)
              if ( $logText ) { Write-Host "regsvr32 ($($leg.label)) output: $logText" }
              if ( $leg.label -eq '64-bit' -and $proc.ExitCode -ne 0 ) {
                throw "regsvr32 (64-bit) failed with exit code $($proc.ExitCode)"
              }
              if ( $leg.label -eq '32-bit' -and $proc.ExitCode -ne 0 ) {
                Write-Host "WARNING: regsvr32 (32-bit) failed on this runner; continuing (x86 DLL verified via package asserts)."
              }
            }

            # Registry-level asserts: Instance key DevicePath (phase 3) and
            # exactly one registration per registry view (no ambiguity).
            $inprocPath = "Registry::HKEY_CLASSES_ROOT\CLSID\{$Clsid}\InprocServer32"
            if ( -not (Test-Path $inprocPath) ) {
              throw "Virtualcam CLSID not registered (expected in $inprocPath)."
            }
            $instanceKey = "Registry::HKEY_CLASSES_ROOT\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance\{$Clsid}"
            $devicePath = (Get-ItemProperty -Path $instanceKey -ErrorAction SilentlyContinue).DevicePath
            if ( -not $devicePath -or ($devicePath -notmatch '^\\\\\?\\usb#vid_[0-9a-f]{4}&pid_[0-9a-f]{4}#[^#]+#\{[0-9a-f\-]{36}\}$') ) {
              throw "Instance key DevicePath missing or not USB-format: '$devicePath'"
            }
            Write-Host "DevicePath: $devicePath"

            # Enumerate from an app's perspective (64-bit DShow).
            $devices = [VCamSmoke.DShowEnum]::Enumerate()
            $dshowMatches = @($devices | Where-Object { $_.Moniker -match [regex]::Escape("{$Clsid}") })
            if ( $dshowMatches.Count -ne 1 ) {
              throw "Expected exactly 1 DShow match for CLSID $($Clsid), got $($dshowMatches.Count)."
            }
            if ( $dshowMatches[0].FriendlyName -ne $BrandName ) {
              throw "Friendly name mismatch: '$($dshowMatches[0].FriendlyName)' (expected '$BrandName')."
            }
            # The registry Instance key assert above is the authoritative
            # phase-3 check; the moniker property bag surfaces DevicePath for
            # hardware devices, and for software filters only when the runtime
            # exposes it - so here a present-but-wrong value fails, an absent
            # one is tolerated.
            if ( $dshowMatches[0].DevicePath -and ($dshowMatches[0].DevicePath -notmatch '^\\\\\?\\usb#') ) {
              throw "Moniker DevicePath present but not USB-format: '$($dshowMatches[0].DevicePath)'"
            }
            Write-Host "Smoke test passed: 1 device, name '$($dshowMatches[0].FriendlyName)', DevicePath(moniker) '$($dshowMatches[0].DevicePath)'."
          } finally {
            foreach ( $cleanup in @(@{ dll = $dll64; regsvr = "$env:SystemRoot\System32\regsvr32.exe" }, @{ dll = $dll32; regsvr = "$env:SystemRoot\SYSWOW64\regsvr32.exe" }) ) {
              try {
                $proc = Start-Process -FilePath $cleanup.regsvr -ArgumentList '/u', '/s', "`"$($cleanup.dll)`"" -Wait -PassThru -ErrorAction SilentlyContinue
                Write-Host "unregister $($cleanup.dll) exit code: $($proc.ExitCode)"
              } catch {
                Write-Host "WARNING: unregister failed for $($cleanup.dll): $($_.Exception.Message)"
              }
            }
            Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          }

      - name: Inno Setup Installer 📦
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Get-ChildItem -Path "build_${{ matrix.architecture }}" -Filter "obs-studio-*-windows-${{ matrix.architecture }}.zip" -File | Select-Object -First 1
          if ( -not $zip ) {
            throw "No package zip found for the installer."
          }

          choco install innosetup -y --no-progress
          $Iscc = Join-Path (${env:ProgramFiles(x86)}) 'Inno Setup 6\ISCC.exe'
          if ( -not (Test-Path $Iscc) ) {
            throw "ISCC.exe not found at $Iscc after innosetup install."
          }

          # The installer compiles against the unpacked package tree.
          $installSource = Join-Path $env:RUNNER_TEMP 'installer-source'
          Remove-Item -Recurse -Force $installSource -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installSource -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $installSource)

          $GitDescription = (git describe --tags --long)
          $Tokens = ($GitDescription -split '-')
          $Version = $Tokens[0..$($Tokens.Count - 3)] -join '-'

          & $Iscc "/DSourceDir=$installSource" "/DAppVersion=$Version" packaging/windows/installer.iss
          if ( $LASTEXITCODE -ne 0 ) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $installer = Get-ChildItem -Path $installSource -Filter 'OBS-Studio-*-Windows-x64-Installer.exe' -File | Select-Object -First 1
          if ( -not $installer ) {
            throw "Installer output not found after ISCC."
          }
          Move-Item $installer.FullName "build_${{ matrix.architecture }}\"
          Write-Host "Installer built: build_${{ matrix.architecture }}\$($installer.Name)"

      - name: Upload Build Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-windows-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/build_${{ matrix.architecture }}/obs-studio-*-windows-${{ matrix.architecture }}.zip
            ${{ github.workspace }}/build_${{ matrix.architecture }}/OBS-Studio-*-Windows-x64-Installer.exe
          retention-days: 30

      - name: Create GitHub Release 🛫
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload release artifacts (tag builds only). Release creation is
          # guarded but not atomic: all three OS workflows race on the first
          # tag build (red-team F3), so a failed create falls back to view +
          # upload instead of dropping this platform's artifacts.
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'

          $zip = Get-ChildItem -Path "build_${{ matrix.architecture }}" -Filter "obs-studio-*-windows-${{ matrix.architecture }}.zip" -File | Select-Object -First 1
          if ( -not $zip ) {
            throw "No package zip found for release upload."
          }

          # Release-facing names (OBS-Studio-<ver>-Windows-x64[.zip|-Installer.exe])
          $GitDescription = (git describe --tags --long)
          $Tokens = ($GitDescription -split '-')
          $Version = $Tokens[0..$($Tokens.Count - 3)] -join '-'
          $staging = Join-Path $env:RUNNER_TEMP 'release-upload'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $releaseZip = Join-Path $staging "OBS-Studio-${Version}-Windows-x64.zip"
          Copy-Item $zip.FullName $releaseZip
          $uploads = @($releaseZip)

          $installer = Get-ChildItem -Path "build_${{ matrix.architecture }}" -Filter 'OBS-Studio-*-Windows-x64-Installer.exe' -File | Select-Object -First 1
          if ( $installer ) {
            $uploads += $installer.FullName
          } else {
            Write-Host "WARNING: no installer artifact found; uploading the zip only."
          }

          gh release view $tag --repo ${Env:GITHUB_REPOSITORY} *> $null
          if ( $LASTEXITCODE -ne 0 ) {
            $notes = @(
              "OBS Studio **$tag** — fork with the Virtual Camera registered as **Logitech HD Pro Webcam C920** (GUID 76692E1E-F28F-4DD6-9024-C3A999D30EFB).",
              "",
              "**Windows**: portable ZIP (includes the portable_mode marker and the self-audit harness under auxdata/vcam-audit/) and an Inno Setup installer. Identity changes without a rebuild: core\win-dshow\data\vcamctl.exe (get/set/reset) or the Virtual Camera configuration dialog in OBS (requires admin approval).",
              "",
              "**macOS** (unsigned/ad-hoc): activate with systemextensionsctl developer on for the camera extension; the DAL plugin reads as HD Pro Webcam C920.",
              "",
              "**Linux**: .deb, portable tar.gz, and the vcamuvc DKMS module (reports driver name uvcvideo). Audit scripts for all three OS ship in the Windows zip (auxdata/vcam-audit/) and under tools/ per OS."
            ) -join "`n"
            gh release create $tag `
              --repo ${Env:GITHUB_REPOSITORY} `
              --title "OBS Studio ${tag}" `
              --notes $notes `
              $uploads
            if ( $LASTEXITCODE -ne 0 ) {
              # Another OS workflow created the release between the view and
              # the create; upload into it as long as it now exists.
              gh release view $tag --repo ${Env:GITHUB_REPOSITORY} *> $null
              if ( $LASTEXITCODE -ne 0 ) {
                throw "Release creation failed for $tag."
              }
              gh release upload $tag --repo ${Env:GITHUB_REPOSITORY} --clobber $uploads
            }
          } else {
            gh release upload $tag --repo ${Env:GITHUB_REPOSITORY} --clobber $uploads
          }

          # A tag push auto-creates a DRAFT release in this repo (the view
          # guard above then finds it and only uploads); publish once the
          # artifacts are in.
          gh release edit $tag --repo ${Env:GITHUB_REPOSITORY} --draft=false
